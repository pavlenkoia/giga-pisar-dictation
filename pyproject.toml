[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "giga-pisar-dictation"
version = "0.2.12"
description = "Русский клиент диктовки для Linux X11 и API Giga Pisar в доверенной локальной сети"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
giga-pisar-dictation = "giga_pisar_dictation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
